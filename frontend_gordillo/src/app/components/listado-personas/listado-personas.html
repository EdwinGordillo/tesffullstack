<mat-toolbar color="primary">
  <span>Gestión de Personas</span>
  <span class="spacer"></span>
  <button mat-button color="accent" (click)="crear()">+ Nueva Persona</button>
</mat-toolbar>

<mat-card>
  <table mat-table [dataSource]="personas" class="mat-elevation-z8">

    <!-- Nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let persona"> {{ persona.nombre }} </td>
    </ng-container>

    <!-- Apellido -->
    <ng-container matColumnDef="apellido">
      <th mat-header-cell *matHeaderCellDef> Apellido </th>
      <td mat-cell *matCellDef="let persona"> {{ persona.apellido }} </td>
    </ng-container>

    <!-- Fecha Nacimiento -->
    <ng-container matColumnDef="fechaNacimiento">
      <th mat-header-cell *matHeaderCellDef> Nacimiento </th>
      <td mat-cell *matCellDef="let persona"> {{ persona.fechaNacimiento | date }} </td>
    </ng-container>

    <!-- Puesto -->
    <ng-container matColumnDef="puesto">
      <th mat-header-cell *matHeaderCellDef> Puesto </th>
      <td mat-cell *matCellDef="let persona"> {{ persona.puesto }} </td>
    </ng-container>

    <!-- Sueldo -->
    <ng-container matColumnDef="sueldo">
      <th mat-header-cell *matHeaderCellDef> Sueldo </th>
      <td mat-cell *matCellDef="let persona"> {{ persona.sueldo | currency:'COP' }} </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let persona">
        <button mat-icon-button color="primary" (click)="editar(persona.id)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(persona.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</mat-card>
